
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fantasy Highlights | Dirty Ducks</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
            margin: 0;
            padding: 30px 16px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        .status {
            margin-bottom: 20px;
            color: #555;
        }

        .player {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .player-name {
            font-size: 22px;
            font-weight: bold;
        }

        .player-info {
            color: #666;
            margin-top: 5px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .video {
            min-width: 0;
        }

        .video a {
            color: inherit;
            text-decoration: none;
        }

        .video img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 7px;
            background: #ddd;
        }

        .video-title {
            font-weight: bold;
            font-size: 14px;
            line-height: 1.4;
            margin-top: 8px;
        }

        .video-date {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .videos {
            margin-top: 15px;
            color: #888;
        }

        .error {
            background: #fff;
            padding: 18px;
            border-radius: 8px;
            color: #a12622;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .player {
                padding: 15px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Fantasy Highlights</h1>

    <div class="subtitle">
        Videos published in the last 7 days
    </div>

    <div id="status" class="status">
        Loading your Yahoo Fantasy roster...
    </div>

    <div id="players"></div>

</div>

<script>
const YOUTUBE_API_KEY = "AIzaSyDA7ORUUGoY1257EscDWfeBPwO93MtnVCU";
const NFL_CHANNEL_ID = "UCDVYQ4Zhbm3S2dlz7P1GBDg";

// Official team YouTube channel IDs can be added here later.
const teamChannels = {};

const playersContainer = document.getElementById("players");
const statusElement = document.getElementById("status");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function normalizeText(value) {
    return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
}

async function searchYouTube(channelId, player) {
    const now = new Date();
    const sevenDaysAgo = new Date(
        now.getTime() - 7 * 24 * 60 * 60 * 1000
    );

    const params = new URLSearchParams({
        part: "snippet",
        channelId,
        q: `"${player.searchName || player.name}"`,
        type: "video",
        order: "date",
        publishedAfter: sevenDaysAgo.toISOString(),
        publishedBefore: now.toISOString(),
        maxResults: "10",
        key: YOUTUBE_API_KEY
    });

    const response = await fetch(
        "https://www.googleapis.com/youtube/v3/search?" +
        params.toString()
    );

    if (!response.ok) {
        const message = await response.text();
        console.error(
            "YouTube search failed:",
            response.status,
            message.slice(0, 500)
        );
        return [];
    }

    const data = await response.json();
    return data.items || [];
}

function isRelevantVideo(video, player) {
    const title = normalizeText(video.snippet?.title);
    const description = normalizeText(video.snippet?.description);
    const playerName = normalizeText(player.name);

    // Require the player's name to appear in the title.
    // This avoids accepting videos that only mention the player
    // in a long description.
    if (!title.includes(playerName)) {
        return false;
    }

    // Exclude obvious unrelated videos.
    const unwantedTerms = [
        "fantasy football advice",
        "madden",
        "mock draft",
        "college highlights"
    ];

    if (unwantedTerms.some(term => title.includes(term))) {
        return false;
    }

    return true;
}

function displayPlayer(player, videos) {
    const playerDiv = document.createElement("section");
    playerDiv.className = "player";

    const heading = document.createElement("div");
    heading.className = "player-name";
    heading.textContent = player.name;

    const info = document.createElement("div");
    info.className = "player-info";
    info.textContent =
        `${player.position || "Player"} • ${player.team || "NFL team"}`;

    playerDiv.appendChild(heading);
    playerDiv.appendChild(info);

    if (videos.length === 0) {
        const message = document.createElement("div");
        message.className = "videos";
        message.textContent =
            "No relevant videos found in the last 7 days.";
        playerDiv.appendChild(message);
    } else {
        const grid = document.createElement("div");
        grid.className = "video-grid";

        for (const video of videos) {
            const videoId = video.id?.videoId;
            if (!videoId) continue;

            const link = document.createElement("a");
            link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.setAttribute("aria-label", video.snippet?.title || "Watch video");

            const image = document.createElement("img");
            image.src =
                video.snippet?.thumbnails?.medium?.url ||
                video.snippet?.thumbnails?.default?.url ||
                "";
            image.alt = video.snippet?.title || "Video thumbnail";
            image.loading = "lazy";

            link.appendChild(image);

            const title = document.createElement("div");
            title.className = "video-title";
            title.textContent = video.snippet?.title || "Untitled video";

            const date = document.createElement("div");
            date.className = "video-date";

            const published = video.snippet?.publishedAt
                ? new Date(video.snippet.publishedAt).toLocaleDateString()
                : "Date unavailable";

            date.textContent =
                `${published} • ${video.snippet?.channelTitle || "YouTube"}`;

            const card = document.createElement("article");
            card.className = "video";
            card.append(link, title, date);
            grid.appendChild(card);
        }

        playerDiv.appendChild(grid);
    }

    playersContainer.appendChild(playerDiv);
}

async function loadVideos() {
    playersContainer.replaceChildren();
    statusElement.textContent = "Loading your Yahoo Fantasy roster...";

    try {
        // This JSON file is generated by your GitHub Actions workflow.
        const rosterResponse = await fetch(
            `data/roster.json?updated=${Date.now()}`
        );

        if (!rosterResponse.ok) {
            throw new Error(
                `Could not load data/roster.json (HTTP ${rosterResponse.status}).`
            );
        }

        const rosterData = await rosterResponse.json();

        if (!Array.isArray(rosterData.players) || rosterData.players.length === 0) {
            throw new Error("Your Yahoo roster file contains no players.");
        }

        const fantasyPlayers = rosterData.players.map(player => ({
            name: player.name,
            team: player.team,
            position: player.position,
            searchName: player.searchName || player.name
        }));

        statusElement.textContent =
            `Loaded ${fantasyPlayers.length} players from Yahoo. Searching for recent highlights...`;

        for (const player of fantasyPlayers) {
            const searchChannels = [NFL_CHANNEL_ID];

            if (teamChannels[player.team]) {
                searchChannels.push(teamChannels[player.team]);
            }

            const results = await Promise.all(
                searchChannels.map(channelId =>
                    searchYouTube(channelId, player)
                )
            );

            const uniqueVideos = new Map();

            for (const video of results.flat()) {
                const videoId = video.id?.videoId;

                if (
                    videoId &&
                    isRelevantVideo(video, player)
                ) {
                    uniqueVideos.set(videoId, video);
                }
            }

            const videos = [...uniqueVideos.values()]
                .sort((a, b) =>
                    new Date(b.snippet.publishedAt) -
                    new Date(a.snippet.publishedAt)
                );

            displayPlayer(player, videos);
        }

        const updatedAt = rosterData.updatedAt
            ? new Date(rosterData.updatedAt).toLocaleString()
            : "unknown";

        statusElement.textContent =
            `Showing highlights for ${fantasyPlayers.length} Yahoo roster players. Roster last updated: ${updatedAt}.`;

    } catch (error) {
        console.error(error);
        statusElement.textContent = "";

        const errorMessage = document.createElement("div");
        errorMessage.className = "error";
        errorMessage.textContent =
            `${error.message} Check that data/roster.json exists in your published GitHub Pages site.`;

        playersContainer.appendChild(errorMessage);
    }
}

loadVideos();
</script>

</body>
</html>
