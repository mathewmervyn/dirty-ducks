async function searchYouTube(channelId, player) {

    const now = new Date();

    const sevenDaysAgo = new Date(
        now.getTime() - (7 * 24 * 60 * 60 * 1000)
    );

    const params = new URLSearchParams({

        part: "snippet",

        channelId: channelId,

        q: player.searchName,

        type: "video",

        order: "date",

        publishedAfter: sevenDaysAgo.toISOString(),

        publishedBefore: now.toISOString(),

        maxResults: "10",

        key: YOUTUBE_API_KEY

    });


    const url =
        "https://www.googleapis.com/youtube/v3/search?" +
        params.toString();


    const response = await fetch(url);

    if (!response.ok) {

        console.error(
            "YouTube API error:",
            response.status
        );

        return [];

    }


    const data = await response.json();

    return data.items || [];

}


async function loadVideos() {

    const container =
        document.getElementById("players");


    container.innerHTML =
        "<p>Searching YouTube...</p>";


    for (const player of fantasyPlayers) {

        console.log(
            "Searching for:",
            player.name
        );


        /*
            Search the official NFL channel.
        */

        const nflVideos =
            await searchYouTube(
                NFL_CHANNEL_ID,
                player
            );


        /*
            Search the player's team channel
            if we have its channel ID.
        */

        let teamVideos = [];

        const teamChannelId =
            teamChannels[player.team];


        if (teamChannelId) {

            teamVideos =
                await searchYouTube(
                    teamChannelId,
                    player
                );

        }


        /*
            Combine NFL + team videos.
        */

        const allVideos = [
            ...nflVideos,
            ...teamVideos
        ];


        /*
            Remove duplicate videos.
        */

        const uniqueVideos = [
            ...new Map(
                allVideos.map(video => [
                    video.id.videoId,
                    video
                ])
            ).values()
        ];


        displayPlayer(
            player,
            uniqueVideos
        );

    }

}


function displayPlayer(player, videos) {

    const container =
        document.getElementById("players");


    /*
        Find existing player section,
        or create one.
    */

    let playerDiv =
        document.getElementById(
            "player-" + player.name
                .replace(/[^a-zA-Z0-9]/g, "-")
        );


    if (!playerDiv) {

        playerDiv =
            document.createElement("div");

        playerDiv.className = "player";

        playerDiv.id =
            "player-" +
            player.name.replace(
                /[^a-zA-Z0-9]/g,
                "-"
            );

        container.appendChild(playerDiv);

    }


    let videoHTML = "";


    if (videos.length === 0) {

        videoHTML =
            `<div class="videos">
                No videos found in the last 7 days.
            </div>`;

    } else {

        videoHTML = videos.map(video => {

            const videoId =
                video.id.videoId;

            const title =
                video.snippet.title;

            const published =
                new Date(
                    video.snippet.publishedAt
                ).toLocaleDateString();


            return `
                <div class="video">

                    <a
                        href="https://www.youtube.com/watch?v=${videoId}"
                        target="_blank"
                    >

                        <img
                            src="${video.snippet.thumbnails.medium.url}"
                            alt="${title}"
                        >

                    </a>

                    <div class="video-title">
                        ${title}
                    </div>

                    <div class="video-date">
                        ${published}
                        •
                        ${video.snippet.channelTitle}
                    </div>

                </div>
            `;

        }).join("");

    }


    playerDiv.innerHTML = `

        <div class="player-name">
            ${player.name}
        </div>

        <div class="player-info">
            ${player.position} • ${player.team}
        </div>

        <div class="videos">

            ${videoHTML}

        </div>

    `;

}
