
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Highlights | Dirty Ducks</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
            margin: 0;
            padding: 30px 16px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        .status {
            color: #555;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .player {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .player-name {
            font-size: 22px;
            font-weight: bold;
        }

        .player-info {
            color: #666;
            margin-top: 5px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .video {
            min-width: 0;
        }

        .video a {
            color: inherit;
            text-decoration: none;
        }

        .video img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 7px;
            background: #ddd;
        }

        .video-title {
            font-weight: bold;
            font-size: 14px;
            line-height: 1.4;
            margin-top: 8px;
        }

        .video-date {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .no-videos {
            color: #888;
            margin-top: 15px;
        }

        .error {
            background: white;
            padding: 18px;
            border-radius: 8px;
            color: #a12622;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .player {
                padding: 15px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Fantasy Highlights</h1>

    <div class="subtitle">
        Recent videos from the last 7 days
    </div>

    <div id="status" class="status">
        Loading your Yahoo Fantasy roster...
    </div>

    <div id="players"></div>

</div>

<script>
const YOUTUBE_API_KEY = "AIzaSyDA7ORUUGoY1257EscDWfeBPwO93MtnVCU";

const NFL_CHANNEL_ID = "UCDVYQ4Zhbm3S2dlz7P1GBDg";

// Official NFL team YouTube handles.
// The API resolves these to permanent channel IDs.
const teamChannelHandles = {
    "Arizona Cardinals": "@AZCardinals",
    "Atlanta Falcons": "@AtlantaFalcons",
    "Baltimore Ravens": "@BaltimoreRavens",
    "Buffalo Bills": "@BuffaloBills",
    "Carolina Panthers": "@CarolinaPanthers",
    "Chicago Bears": "@ChicagoBears",
    "Cincinnati Bengals": "@Bengals",
    "Cleveland Browns": "@Browns",
    "Dallas Cowboys": "@DallasCowboys",
    "Denver Broncos": "@DenverBroncos",
    "Detroit Lions": "@DetroitLions",
    "Green Bay Packers": "@Packers",
    "Houston Texans": "@HoustonTexans",
    "Indianapolis Colts": "@Colts",
    "Jacksonville Jaguars": "@Jaguars",
    "Kansas City Chiefs": "@Chiefs",
    "Las Vegas Raiders": "@Raiders",
    "Los Angeles Chargers": "@Chargers",
    "Los Angeles Rams": "@Rams",
    "Miami Dolphins": "@MiamiDolphins",
    "Minnesota Vikings": "@MinnesotaVikings",
    "New England Patriots": "@NewEnglandPatriots",
    "New Orleans Saints": "@NewOrleansSaints",
    "New York Giants": "@Giants",
    "New York Jets": "@NewYorkJets",
    "Philadelphia Eagles": "@Eagles",
    "Pittsburgh Steelers": "@Steelers",
    "San Francisco 49ers": "@49ers",
    "Seattle Seahawks": "@Seahawks",
    "Tampa Bay Buccaneers": "@Buccaneers",
    "Tennessee Titans": "@TennesseeTitans",
    "Washington Commanders": "@Commanders"
};

// Cache resolved channel IDs for this page visit.
const resolvedTeamChannels = {};

// Common surnames that need stricter matching.
const commonSurnames = new Set([
    "adams", "allen", "anderson", "baker", "brown", "campbell",
    "carter", "clark", "collins", "davis", "edwards", "evans",
    "garcia", "green", "hall", "harris", "hill", "jackson",
    "james", "johnson", "jones", "kelly", "king", "lee",
    "lewis", "martin", "miller", "mitchell", "moore", "morris",
    "murphy", "parker", "phillips", "price", "reed", "richardson",
    "roberts", "robinson", "rodriguez", "ross", "scott", "smith",
    "stewart", "taylor", "thomas", "thompson", "turner", "walker",
    "ward", "washington", "white", "williams", "wilson", "wright",
    "young"
]);

const highlightTerms = [
    "highlight", "highlights", "best plays", "touchdown",
    "touchdowns", "mic'd up", "mic d up", "top plays",
    "game winner", "big plays", "every play", "all touches",
    "interview", "reaction", "rookie"
];

const playersContainer = document.getElementById("players");
const statusElement = document.getElementById("status");

function normalizeText(value) {
    return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

// Resolve a team's permanent YouTube channel ID from its handle.
async function getTeamChannelId(team) {
    if (Object.prototype.hasOwnProperty.call(resolvedTeamChannels, team)) {
        return resolvedTeamChannels[team];
    }

    const handle = teamChannelHandles[team];

    if (!handle) {
        resolvedTeamChannels[team] = "";
        return "";
    }

    const params = new URLSearchParams({
        part: "id",
        forHandle: handle,
        key: YOUTUBE_API_KEY
    });

    try {
        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/channels?" +
            params.toString()
        );

        if (!response.ok) {
            console.error(
                "Could not resolve team channel:",
                team,
                response.status
            );
            resolvedTeamChannels[team] = "";
            return "";
        }

        const data = await response.json();
        const channelId = data.items?.[0]?.id || "";

        resolvedTeamChannels[team] = channelId;

        if (!channelId) {
            console.warn("No channel found for:", team, handle);
        }

        return channelId;
    } catch (error) {
        console.error("Team channel lookup failed:", team, error);
        resolvedTeamChannels[team] = "";
        return "";
    }
}

async function searchYouTube(channelId, query) {
    const now = new Date();
    const sevenDaysAgo = new Date(
        now.getTime() - 7 * 24 * 60 * 60 * 1000
    );

    const params = new URLSearchParams({
        part: "snippet",
        channelId,
        q: query,
        type: "video",
        order: "date",
        publishedAfter: sevenDaysAgo.toISOString(),
        publishedBefore: now.toISOString(),
        maxResults: "10",
        key: YOUTUBE_API_KEY
    });

    try {
        const response = await fetch(
            "https://www.googleapis.com/youtube/v3/search?" +
            params.toString()
        );

        if (!response.ok) {
            console.error("YouTube search failed:", response.status);
            return [];
        }

        const data = await response.json();
        return data.items || [];
    } catch (error) {
        console.error("YouTube request failed:", error);
        return [];
    }
}

function getSurname(player) {
    const words = normalizeText(player.name).split(" ");
    return words[words.length - 1] || "";
}

function getTeamNickname(team) {
    const words = normalizeText(team).split(" ");
    return words[words.length - 1] || "";
}

function isRelevantVideo(video, player, source, queryType) {
    const title = normalizeText(video.snippet?.title);
    const name = normalizeText(player.name);
    const searchName = normalizeText(player.searchName || player.name);
    const surname = getSurname(player);
    const teamNickname = getTeamNickname(player.team);

    const fullNameMatches =
        (name && title.includes(name)) ||
        (searchName && title.includes(searchName));

    // Full-name matches are the safest and preferred result.
    if (fullNameMatches) {
        return true;
    }

    if (!surname || !title.includes(surname)) {
        return false;
    }

    const commonSurname = commonSurnames.has(surname);

    // Distinctive surnames can be used on their own as a fallback.
    if (!commonSurname) {
        return true;
    }

    // Common surnames require extra context.
    const teamMentioned =
        teamNickname && title.includes(teamNickname);

    const highlightMentioned = highlightTerms.some(term =>
        title.includes(normalizeText(term))
    );

    // A common surname is accepted if the title also identifies
    // the team, or if a team-channel video has a relevant highlight term.
    if (teamMentioned) {
        return true;
    }

    if (source === "team" && highlightMentioned) {
        return true;
    }

    // Otherwise, reject the ambiguous surname-only result.
    return false;
}

function makePlayerCard(player, videos) {
    const section = document.createElement("section");
    section.className = "player";

    const heading = document.createElement("div");
    heading.className = "player-name";
    heading.textContent = player.name;

    const info = document.createElement("div");
    info.className = "player-info";
    info.textContent =
        `${player.position || "Player"} • ${player.team || "NFL team"}`;

    section.append(heading, info);

    if (videos.length === 0) {
        const message = document.createElement("div");
        message.className = "no-videos";
        message.textContent =
            "No relevant videos found in the last 7 days.";
        section.appendChild(message);
        return section;
    }

    const grid = document.createElement("div");
    grid.className = "video-grid";

    for (const video of videos) {
        const videoId = video.id?.videoId;
        if (!videoId) continue;

        const card = document.createElement("article");
        card.className = "video";

        const link = document.createElement("a");
        link.href =
            `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const image = document.createElement("img");
        image.src =
            video.snippet?.thumbnails?.medium?.url ||
            video.snippet?.thumbnails?.default?.url ||
            "";
        image.alt = video.snippet?.title || "Video thumbnail";
        image.loading = "lazy";

        link.appendChild(image);

        const title = document.createElement("div");
        title.className = "video-title";
        title.textContent = video.snippet?.title || "Untitled video";

        const date = document.createElement("div");
        date.className = "video-date";

        const published = video.snippet?.publishedAt
            ? new Date(video.snippet.publishedAt).toLocaleDateString()
            : "Date unavailable";

        date.textContent =
            `${published} • ${video.snippet?.channelTitle || "YouTube"}`;

        card.append(link, title, date);
        grid.appendChild(card);
    }

    section.appendChild(grid);
    return section;
}

async function getPlayerVideos(player) {
    const teamChannelId = await getTeamChannelId(player.team);

    const channels = [
        { id: NFL_CHANNEL_ID, source: "nfl" }
    ];

    if (teamChannelId && teamChannelId !== NFL_CHANNEL_ID) {
        channels.push({ id: teamChannelId, source: "team" });
    }

    const primaryQuery = `"${player.searchName || player.name}"`;

    // Search both the main NFL channel and the player's team channel.
    const primaryResults = await Promise.all(
        channels.map(async channel => ({
            source: channel.source,
            videos: await searchYouTube(channel.id, primaryQuery)
        }))
    );

    let matches = [];

    for (const result of primaryResults) {
        for (const video of result.videos) {
            if (isRelevantVideo(video, player, result.source, "full")) {
                matches.push(video);
            }
        }
    }

    // Only use a surname fallback when the full-name search has
    // no relevant results. Common surnames also include the team
    // nickname in the query to improve search relevance.
    if (matches.length === 0) {
        const surname = getSurname(player);
        const commonSurname = commonSurnames.has(surname);
        const fallbackQuery = commonSurname
            ? `${surname} ${getTeamNickname(player.team)}`
            : surname;

        if (surname) {
            const fallbackResults = await Promise.all(
                channels.map(async channel => ({
                    source: channel.source,
                    videos: await searchYouTube(channel.id, fallbackQuery)
                }))
            );

            for (const result of fallbackResults) {
                for (const video of result.videos) {
                    if (isRelevantVideo(
                        video,
                        player,
                        result.source,
                        "surname"
                    )) {
                        matches.push(video);
                    }
                }
            }
        }
    }

    // Remove duplicate video IDs and sort newest first.
    const uniqueVideos = new Map();

    for (const video of matches) {
        const id = video.id?.videoId;
        if (id && !uniqueVideos.has(id)) {
            uniqueVideos.set(id, video);
        }
    }

    return [...uniqueVideos.values()]
        .sort((a, b) =>
            new Date(b.snippet.publishedAt) -
            new Date(a.snippet.publishedAt)
        );
}

async function loadVideos() {
    playersContainer.replaceChildren();
    statusElement.textContent = "Loading your Yahoo Fantasy roster...";

    try {
        const response = await fetch(
            `data/roster.json?updated=${Date.now()}`
        );

        if (!response.ok) {
            throw new Error(
                `Could not load data/roster.json (HTTP ${response.status}).`
            );
        }

        const rosterData = await response.json();

        if (!Array.isArray(rosterData.players) ||
            rosterData.players.length === 0) {
            throw new Error("The Yahoo roster file contains no players.");
        }

        const players = rosterData.players.map(player => ({
            name: player.name,
            team: player.team,
            position: player.position,
            searchName: player.searchName || player.name
        }));

        let completed = 0;

        statusElement.textContent =
            `Loaded ${players.length} players. Searching YouTube...`;

        for (const player of players) {
            statusElement.textContent =
                `Searching for ${player.name} (${completed + 1} of ${players.length})...`;

            const videos = await getPlayerVideos(player);
            playersContainer.appendChild(makePlayerCard(player, videos));

            completed++;
        }

        const updatedAt = rosterData.updatedAt
            ? new Date(rosterData.updatedAt).toLocaleString()
            : "unknown";

        statusElement.textContent =
            `Showing ${players.length} roster players. Yahoo roster last updated: ${updatedAt}.`;

    } catch (error) {
        console.error(error);
        statusElement.textContent = "";

        const message = document.createElement("div");
        message.className = "error";
        message.textContent =
            `${error.message} Check that data/roster.json exists on your published website.`;

        playersContainer.appendChild(message);
    }
}

loadVideos();
</script>

</body>
</html>
