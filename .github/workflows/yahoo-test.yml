
name: Yahoo API setup test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Yahoo API access
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const clientId = process.env.YAHOO_CLIENT_ID;
          const refreshToken = process.env.YAHOO_REFRESH_TOKEN;

          if (!clientId || !refreshToken) {
            console.error("Required GitHub secrets are missing.");
            process.exit(1);
          }

          const tokenResponse = await fetch(
            "https://api.login.yahoo.com/oauth2/get_token",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded"
              },
              body: new URLSearchParams({
                client_id: clientId,
                refresh_token: refreshToken,
                grant_type: "refresh_token"
              })
            }
          );

          if (!tokenResponse.ok) {
            console.error(
              "Yahoo token refresh failed. HTTP status:",
              tokenResponse.status
            );
            process.exit(1);
          }

          const tokens = await tokenResponse.json();

          if (!tokens.access_token) {
            console.error("Yahoo did not return an access token.");
            process.exit(1);
          }

          console.log("Yahoo authentication successful.");

          const apiResponse = await fetch(
            "https://fantasysports.yahooapis.com/fantasy/v2/users;use_login=1/games;game_keys=470/teams?format=json",
            {
              headers: {
                Authorization: `Bearer ${tokens.access_token}`,
                Accept: "application/json"
              }
            }
          );

          if (!apiResponse.ok) {
            const errorText = await apiResponse.text();
            console.error(
              "Yahoo Fantasy API request failed. HTTP status:",
              apiResponse.status
            );
            console.error("Yahoo response:", errorText.slice(0, 2000));
            process.exit(1);
          }

          console.log("Yahoo Fantasy API request successful.");

          const data = await apiResponse.json();
          const teamKeys = new Set();

          function findTeamKeys(value) {
            if (!value || typeof value !== "object") return;

            if (
              typeof value.team_key === "string" &&
              value.team_key.startsWith("470.l.817356.t.")
            ) {
              teamKeys.add(value.team_key);
            }

            for (const child of Object.values(value)) {
              findTeamKeys(child);
            }
          }
            
            const teamKey = "470.l.817356.t.1";

            const teamResponse = await fetch(
              `https://fantasysports.yahooapis.com/fantasy/v2/team/${teamKey}?format=json`,
              {
                headers: {
                  Authorization: `Bearer ${tokens.access_token}`,
                  Accept: "application/json"
                  }
                }
            );

            if (!teamResponse.ok) {
              console.error("Team lookup failed. HTTP status:", teamResponse.status);
              console.error((await teamResponse.text()).slice(0, 1000));
              process.exit(1);
            }

              const teamData = await teamResponse.json();

              console.log("Team details:");
              console.log(JSON.stringify(teamData, null, 2));

          findTeamKeys(data);

          if (teamKeys.size === 0) {
            console.log("No team keys found in this response.");
            console.log(
              "Response structure may need adjustment before retrieving the team key."
            );
            process.exit(1);
          }

          console.log("Your team key candidates:");
          for (const key of teamKeys) {
            console.log(key);
          }
          NODE
