
name: Yahoo API setup test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve Yahoo fantasy roster
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const clientId = process.env.YAHOO_CLIENT_ID;
          const refreshToken = process.env.YAHOO_REFRESH_TOKEN;

          if (!clientId || !refreshToken) {
            console.error("Required GitHub secrets are missing.");
            process.exit(1);
          }

          // 1. Authenticate with Yahoo
          const tokenResponse = await fetch(
            "https://api.login.yahoo.com/oauth2/get_token",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded"
              },
              body: new URLSearchParams({
                client_id: clientId,
                refresh_token: refreshToken,
                grant_type: "refresh_token"
              })
            }
          );

          if (!tokenResponse.ok) {
            console.error(
              "Yahoo authentication failed. HTTP status:",
              tokenResponse.status
            );
            process.exit(1);
          }

          const tokens = await tokenResponse.json();

          if (!tokens.access_token) {
            console.error("Yahoo did not return an access token.");
            process.exit(1);
          }

          console.log("Yahoo authentication successful.");

          // 2. Retrieve your Yahoo team and roster
          const teamKey = "470.l.817356.t.1";

          const rosterResponse = await fetch(
            `https://fantasysports.yahooapis.com/fantasy/v2/team/${teamKey}/roster/players?format=json`,
            {
              headers: {
                Authorization: `Bearer ${tokens.access_token}`,
                Accept: "application/json"
              }
            }
          );

          if (!rosterResponse.ok) {
            console.error(
              "Roster request failed. HTTP status:",
              rosterResponse.status
            );
            console.error((await rosterResponse.text()).slice(0, 2000));
            process.exit(1);
          }

          const rosterData = await rosterResponse.json();

          // 3. Read Yahoo's nested roster structure
          const players = [];
          const playerEntries =
            rosterData.fantasy_content?.team?.[1]?.roster?.[0]?.players;

          if (!playerEntries) {
            console.error("Could not find the players section.");
            console.log(JSON.stringify(rosterData).slice(0, 2000));
            process.exit(1);
          }

          for (const entry of Object.values(playerEntries)) {
            const playerProperties = entry?.player?.[0];

            if (!Array.isArray(playerProperties)) continue;

            const player = {};

            for (const property of playerProperties) {
              if (
                property &&
                typeof property === "object" &&
                !Array.isArray(property)
              ) {
                Object.assign(player, property);
              }
            }

            if (!player.player_key) continue;

            players.push({
              name: player.name?.full || "Unknown player",
              team: player.editorial_team_full_name || "Unknown NFL team",
              position: player.display_position || "Unknown position",
              playerKey: player.player_key,
              playerId: player.player_id
            });
          }

          // 4. Print the roster
          if (players.length === 0) {
            console.error("No players were parsed from Yahoo's response.");
            console.log(
              "Players section:",
              JSON.stringify(playerEntries).slice(0, 2000)
            );
            process.exit(1);
          }

          console.log(`\nTeam key: ${teamKey}`);
          console.log(`Roster retrieved successfully: ${players.length} players\n`);

          for (const player of players) {
            console.log(
              `${player.name} | ${player.team} | ${player.position} | ${player.playerKey}`
            );
          }

          console.log("\nYahoo roster retrieval complete.");
          NODE
