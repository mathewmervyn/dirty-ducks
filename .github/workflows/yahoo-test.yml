
name: Yahoo API setup test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve Yahoo fantasy roster
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const clientId = process.env.YAHOO_CLIENT_ID;
          const refreshToken = process.env.YAHOO_REFRESH_TOKEN;

          if (!clientId || !refreshToken) {
            console.error("Required GitHub secrets are missing.");
            process.exit(1);
          }

          // Refresh Yahoo access token
          const tokenResponse = await fetch(
            "https://api.login.yahoo.com/oauth2/get_token",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded"
              },
              body: new URLSearchParams({
                client_id: clientId,
                refresh_token: refreshToken,
                grant_type: "refresh_token"
              })
            }
          );

          if (!tokenResponse.ok) {
            console.error(
              "Yahoo token refresh failed. HTTP status:",
              tokenResponse.status
            );
            process.exit(1);
          }

          const tokens = await tokenResponse.json();

          if (!tokens.access_token) {
            console.error("Yahoo did not return an access token.");
            process.exit(1);
          }

          console.log("Yahoo authentication successful.");

          // Verify that this is your team and retrieve its details
          const teamKey = "470.l.817356.t.1";

          const teamResponse = await fetch(
            `https://fantasysports.yahooapis.com/fantasy/v2/team/${teamKey}?format=json`,
            {
              headers: {
                Authorization: `Bearer ${tokens.access_token}`,
                Accept: "application/json"
              }
            }
          );

          if (!teamResponse.ok) {
            console.error(
              "Team request failed. HTTP status:",
              teamResponse.status
            );
            console.error((await teamResponse.text()).slice(0, 1000));
            process.exit(1);
          }

          const teamData = await teamResponse.json();
          const teamRoot = teamData.fantasy_content?.team?.[0] || [];
          const teamDetails = {};

          for (const item of teamRoot) {
            if (Array.isArray(item)) continue;
            if (item && typeof item === "object") {
              Object.assign(teamDetails, item);
            }
          }

          console.log("Team:", teamDetails.name || "Unknown");
          console.log(
            "Owned by current login:",
            teamDetails.is_owned_by_current_login === 1 ? "Yes" : "Check response"
          );

          // Retrieve current roster
          const rosterResponse = await fetch(
            `https://fantasysports.yahooapis.com/fantasy/v2/team/${teamKey}/roster/players?format=json`,
            {
              headers: {
                Authorization: `Bearer ${tokens.access_token}`,
                Accept: "application/json"
              }
            }
          );

          if (!rosterResponse.ok) {
            console.error(
              "Roster request failed. HTTP status:",
              rosterResponse.status
            );
            console.error((await rosterResponse.text()).slice(0, 1000));
            process.exit(1);
          }

          const rosterData = await rosterResponse.json();
          const players = [];

          function findPlayers(value) {
            if (!value || typeof value !== "object") return;

            if (value.player_key && value.name) {
              players.push({
                name: value.name.full || "Unknown player",
                nflTeam: value.editorial_team_full_name || "Unknown NFL team",
                position: value.display_position || "Unknown position",
                playerKey: value.player_key
              });
              return;
            }

            for (const child of Object.values(value)) {
              findPlayers(child);
            }
          }

          findPlayers(rosterData);

          if (players.length === 0) {
            console.error("No players found in the roster response.");
            console.log(
              "Response structure:",
              JSON.stringify(rosterData).slice(0, 2000)
            );
            process.exit(1);
          }

          console.log(`\nRoster retrieved successfully: ${players.length} players\n`);

          for (const player of players) {
            console.log(
              `${player.name} | ${player.nflTeam} | ${player.position}`
            );
          }
          NODE
