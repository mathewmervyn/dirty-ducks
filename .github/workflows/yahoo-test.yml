
name: Update Yahoo Fantasy Roster

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update-roster:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Retrieve and save Yahoo roster
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const clientId = process.env.YAHOO_CLIENT_ID;
          const refreshToken = process.env.YAHOO_REFRESH_TOKEN;

          if (!clientId || !refreshToken) {
            throw new Error("Required GitHub secrets are missing.");
          }

          // Authenticate with Yahoo
          const tokenResponse = await fetch(
            "https://api.login.yahoo.com/oauth2/get_token",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded"
              },
              body: new URLSearchParams({
                client_id: clientId,
                refresh_token: refreshToken,
                grant_type: "refresh_token"
              })
            }
          );

          if (!tokenResponse.ok) {
            throw new Error(
              `Yahoo authentication failed: HTTP ${tokenResponse.status}`
            );
          }

          const tokens = await tokenResponse.json();

          if (!tokens.access_token) {
            throw new Error("Yahoo did not return an access token.");
          }

          console.log("Yahoo authentication successful.");

          // Retrieve the current roster
          const teamKey = "470.l.817356.t.1";

          const rosterResponse = await fetch(
            `https://fantasysports.yahooapis.com/fantasy/v2/team/${teamKey}/roster/players?format=json`,
            {
              headers: {
                Authorization: `Bearer ${tokens.access_token}`,
                Accept: "application/json"
              }
            }
          );

          if (!rosterResponse.ok) {
            throw new Error(
              `Roster request failed: HTTP ${rosterResponse.status}`
            );
          }

          const rosterData = await rosterResponse.json();
          const playerEntries =
            rosterData.fantasy_content?.team?.[1]?.roster?.[0]?.players;

          if (!playerEntries) {
            throw new Error("Yahoo roster response has no players section.");
          }

          const players = [];

          for (const entry of Object.values(playerEntries)) {
            const playerProperties = entry?.player?.[0];

            if (!Array.isArray(playerProperties)) continue;

            const player = {};

            for (const property of playerProperties) {
              if (
                property &&
                typeof property === "object" &&
                !Array.isArray(property)
              ) {
                Object.assign(player, property);
              }
            }

            if (!player.player_key || !player.name?.full) continue;

            players.push({
              name: player.name.full,
              team: player.editorial_team_full_name || "",
              position: player.display_position || "",
              playerKey: player.player_key,
              playerId: String(player.player_id || ""),
              searchName: player.name.full
            });
          }

          if (players.length === 0) {
            throw new Error("No players parsed. Existing roster file will be preserved.");
          }

          // Create data/roster.json
          const outputDirectory = "data";
          fs.mkdirSync(outputDirectory, { recursive: true });

          const outputPath = path.join(outputDirectory, "roster.json");

          fs.writeFileSync(
            outputPath,
            JSON.stringify(
              {
                updatedAt: new Date().toISOString(),
                teamKey,
                players
              },
              null,
              2
            ) + "\n"
          );

          console.log(`Saved ${players.length} players to ${outputPath}.`);
          NODE

      - name: Commit updated roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roster.json

          if git diff --cached --quiet; then
            echo "Roster has not changed. No commit needed."
          else
            git commit -m "Update Yahoo fantasy roster"
            git push
          fi
